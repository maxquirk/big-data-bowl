[project]
name = "bigdatabowl"
version = "0.1.0"
description = "NFL Big Data Bowl 2027 -- linking Combine sensor tracking to NFL game performance"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "kaggle>=1.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4.0", "jupytext>=1.16", "ipykernel>=6.29", "ruff>=0.4", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigdatabowl"]

[tool.ruff]
line-length = 100
